
name: Deploy BlueStatic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-br">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=HTML/index.html">
            <title>BlueStatic</title>
          </head>
          <body>
            <p><a href="HTML/index.html">Abrir BlueStatic</a></p>
          </body>
          </html>
          EOF

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
